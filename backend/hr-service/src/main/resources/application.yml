server:
  port: 8081

spring:
  application:
    name: ekap-hr-service-springai
  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/ekap}
    username: ekap
    password: ${POSTGRES_PASSWORD:ekap_dev}
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 2048
    vectorstore:
      weaviate:
        host: ${WEAVIATE_HOST:localhost}
        port: ${WEAVIATE_PORT:8082}
        use-https: false
        filter-field: subVertical
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

ekap:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:ekap_minio}
    secret-key: ${MINIO_SECRET_KEY:ekap_minio_secret_dev}
    bucket: ekap-documents
